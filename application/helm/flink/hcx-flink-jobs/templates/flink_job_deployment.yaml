---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jobmanager
  namespace: {{ .Values.namespace }}
  labels:
    app: flink
    component: {{ .Release.Name }}-jobmanager
spec:
  type: ClusterIP
  ports:
    - name: rpc
      port: {{ .Values.jobmanager.rpc_port }}
    - name: blob
      port: {{ .Values.jobmanager.blob_port }}
    - name: query
      port: {{ .Values.jobmanager.query_port }}
    - name: ui
      port: {{ .Values.jobmanager.ui_port }}
    - name: prom
      port: {{ .Values.jobmanager.prom_port }}
  selector:
    app: flink
    component: {{ .Release.Name }}-jobmanager

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jobmanager-webui
  namespace: {{ .Values.namespace }}
  {{- with .Values.service.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: {{ .Values.rest_port }}
      protocol: TCP
      targetPort: {{ .Values.resttcp_port }}
  selector:
    app: flink
    component: {{ .Release.Name }}-jobmanager

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-taskmanager-prometheus
  namespace: {{ .Values.namespace }}
  labels:
    app: flink
    component: {{ .Release.Name }}-taskmanager
spec:
  type: ClusterIP
  ports:
    - name: prom
      port: {{ .Values.taskmanager.prom_port }}
  selector:
    app: flink
    component: {{ .Release.Name }}-taskmanager

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-jobmanager
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: flink
      component: {{ .Release.Name }}-jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: {{ .Release.Name }}-jobmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.jobmanager.prom_port }}"
    spec:
      serviceAccountName: {{ .Release.Namespace }}-sa
      restartPolicy: Always
      volumes:
        - name: flink-config-volume
          configMap:
            name: {{ .Release.Name }}-config
            items:
              - key: flink-conf
                path: flink-conf.yaml
              - key: base-config
                path: base-config.conf
              - key: {{ .Release.Name }}
                path: {{ .Release.Name }}.conf
              - key: log4j_console_properties
                path: log4j-console.properties
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-jobmanager
          image: "{{ .Values.hcx_pipeline_jobs.image.repository }}{{ if .Values.image.tag }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: Always
          workingDir: /opt/flink
          command: ["/opt/flink/bin/standalone-job.sh"]
          args:
            - start-foreground
            - --job-classname={{ index .Values .Release.Name "job_classname" }}
            - -Dweb.submit.enable=false
            - -Dmetrics.reporter.prom.class=org.apache.flink.metrics.prometheus.PrometheusReporter
            - -Dmetrics.reporter.prom.port={{ .Values.jobmanager.prom_port }}
            - -Djobmanager.rpc.address={{ .Release.Name }}-jobmanager
            - -Djobmanager.rpc.port={{ .Values.jobmanager.rpc_port }}
            - -Dparallelism.default=1
            - -Dblob.server.port={{ .Values.jobmanager.blob_port }}
            - -Dqueryable-state.server.ports={{ .Values.jobmanager.query_port }}
            {{- range $v := .Values.jobManagerAdditionalArgs }}
            - {{ $v }}
            {{- end }}
            - --config.file.path
            - /data/flink/conf/{{ .Release.Name }}.conf
          ports:
            - containerPort: {{ .Values.jobmanager.rpc_port }}
              name: rpc
            - containerPort: {{ .Values.jobmanager.blob_port }}
              name: blob
            - containerPort: {{ .Values.jobmanager.query_port }}
              name: query
            - containerPort: {{ .Values.jobmanager.ui_port }}
              name: ui
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
            - name: flink-config-volume
              mountPath: /data/flink/conf/base-config.conf
              subPath: base-config.conf
            - name: flink-config-volume
              mountPath: /data/flink/conf/{{ .Release.Name }}.conf
              subPath: {{ .Release.Name }}.conf
            - name: flink-config-volume
              mountPath: /opt/flink/conf/log4j-console.properties
              subPath: log4j-console.properties
          resources:
{{ toYaml .Values.hcx_pipeline_jobs.jobmanagerResources | indent 12 }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-taskmanager
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.taskmanager.replicas }}
  selector:
    matchLabels:
      app: flink
      component: {{ .Release.Name }}-taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: {{ .Release.Name }}-taskmanager
    spec:
      serviceAccountName: {{ .Release.Namespace }}-sa
      volumes:
        - name: flink-config-volume
          configMap:
            name: {{ .Release.Name }}-config
            items:
              - key: flink-conf
                path: flink-conf.yaml
              - key: log4j_console_properties
                path: log4j-console.properties
              - key: base-config
                path: base-config.conf
              - key: {{ .Release.Name }}
                path: {{ .Release.Name }}.conf
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-taskmanager
          image: "{{ .Values.hcx_pipeline_jobs.image.repository }}{{ if .Values.image.tag }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: Always
          workingDir: {{ .Values.taskmanager.flink_work_dir }}
          command: ["/opt/flink/bin/taskmanager.sh"]
          args:
            - start-foreground
            - -Dweb.submit.enable=false
            - -Dmetrics.reporter.prom.class=org.apache.flink.metrics.prometheus.PrometheusReporter
            - -Dmetrics.reporter.prom.host={{ .Release.Name }}-taskmanager
            - -Dmetrics.reporter.prom.port=9251-9260
            - -Djobmanager.rpc.address={{ .Release.Name }}-jobmanager
            - -Dtaskmanager.rpc.port={{ .Values.taskmanager.rpc_port }}
            {{- range $v := .Values.taskManagerAdditionalArgs }}
            - {{ $v }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.taskmanager.rpc_port }}
              name: rpc
          {{- if .Values.healthcheck }}
          livenessProbe:
{{ toYaml .Values.livenessProbe | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
            - name: flink-config-volume
              mountPath: /opt/flink/conf/log4j-console.properties
              subPath: log4j-console.properties
            - name: flink-config-volume
              mountPath: /data/flink/conf/base-config.conf
              subPath: base-config.conf
            - name: flink-config-volume
              mountPath: /data/flink/conf/{{ .Release.Name }}.conf
              subPath: {{ .Release.Name }}.conf
          resources:
{{ toYaml .Values.hcx_pipeline_jobs.taskmanagerResources | indent 12 }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
